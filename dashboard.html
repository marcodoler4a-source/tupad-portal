<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <title>TUPAD Portal Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; min-height: 100vh; }
    header { background: #1e3a8a; color: white; padding: 22px max(20px, calc((100% - 1050px)/2)); display:flex; align-items:center; justify-content:space-between; gap:16px; }
    header h1 { margin:0; font-size:20px; }
    main { max-width:1050px; margin:36px auto; padding:0 20px; }
    .card { background:white; border-radius:14px; padding:28px; box-shadow:0 8px 28px rgba(15,23,42,.07); }
    .muted { color:#64748b; }
    button { background:#dc2626; color:white; border:0; padding:11px 18px; border-radius:8px; cursor:pointer; font-weight:600; }
    button:hover { background:#b91c1c; }
    #status { padding:12px 0; }
    @media(max-width:520px) { header { align-items:flex-start; flex-direction:column; } main { margin-top:20px; } }
  </style>
</head>
<body>
  <header>
    <h1>DOLE REGION IV-A | TUPAD PORTAL</h1>
    <button type="button" id="logoutBtn">Sign Out</button>
  </header>
  <main>
    <section class="card">
      <h2>Welcome to the TUPAD Portal</h2>
      <p id="status" class="muted" role="status">Verifying your session...</p>
      <p id="userInfo"></p>
    </section>
  </main>
  <script>
    const token = sessionStorage.getItem('tupad_token');
    const statusEl = document.getElementById('status');
    const userInfo = document.getElementById('userInfo');

    function logout() {
      sessionStorage.removeItem('tupad_token');
      sessionStorage.removeItem('tupad_username');
      window.location.replace('/');
    }
    document.getElementById('logoutBtn').addEventListener('click', logout);

    async function verifySession() {
      if (!token) {
        window.location.replace('/');
        return;
      }
      try {
        const response = await fetch('/api/me', {
          headers: { Authorization: 'Bearer ' + token },
          cache: 'no-store'
        });
        const result = await response.json();
        if (!response.ok || !result.success || !result.user) {
          throw new Error('Your session is invalid or has expired.');
        }
        statusEl.textContent = 'You are signed in.';
        userInfo.textContent = 'Signed in as: ' + result.user.username;
      } catch (error) {
        logout();
      }
    }
    verifySession();
  </script>
</body>
</html>
